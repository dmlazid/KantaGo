plugins { id 'com.android.application' }
android {
 namespace 'com.kantago.app'
 compileSdk 35
 defaultConfig { applicationId 'com.kantago.player'; minSdk 26; targetSdk 34; versionCode 4; versionName '0.6.0' }
 compileOptions { sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 }
 // Explicitly use the same cached signing key checked by GitHub Actions.
 // Android Gradle Plugin defaults to $ANDROID_USER_HOME, which on GitHub runners
 // is /home/runner/.config/.android, NOT /home/runner/.android.
 // The previous setup silently signed every APK with a fresh transient key.
 signingConfigs {
  debug {
   storeFile file(System.getenv('KANTAGO_SIGNING_KEYSTORE') ?: ((System.getenv('HOME') ?: System.getProperty('user.home')) + '/.android/debug.keystore'))
   storePassword 'android'
   keyAlias 'androiddebugkey'
   keyPassword 'android'
  }
 }
 buildTypes {
  debug { signingConfig signingConfigs.debug }
  release { minifyEnabled false }
 }
}
dependencies {
 implementation 'com.google.zxing:core:3.5.3'
 implementation 'org.apache.commons:commons-compress:1.27.1'
 implementation 'org.tukaani:xz:1.10'
}

/* Regenerate the copyright-safe offline music catalog on every local/CI build. */
tasks.register('generateBuiltinKaraoke', Exec) {
 workingDir rootProject.projectDir
 commandLine 'python3','tools/build_builtin_library.py','--output','app/src/main/assets/builtin'
}
tasks.matching { it.name == 'preBuild' }.configureEach {
 dependsOn tasks.named('generateBuiltinKaraoke')
}
