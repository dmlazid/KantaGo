name: Build APK
on:
  push:
    branches: [main]
    paths-ignore: ['README.md', 'docs/**']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools platforms;android-35 build-tools;35.0.0
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Core checks
        run: |
          bash tests/run.sh
          node --check app/src/main/assets/app.js
      - name: Build installable test APK
        run: gradle :app:assembleDebug :app:lintDebug --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: KantaGo-0.2.0-debug
          path: app/build/outputs/apk/debug/app-debug.apk
      - name: Publish test build
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp app/build/outputs/apk/debug/app-debug.apk KantaGo-0.2.0-test.apk
          TAG="test-${GITHUB_RUN_NUMBER}"
          gh release create "$TAG" KantaGo-0.2.0-test.apk --title "KantaGo 0.2.0 · Test build ${GITHUB_RUN_NUMBER}" --prerelease --notes "0.2.0: sortable song library, file-type filters, MP4 video fix, audio/video seeking, adjustable lyric sync, queue shuffle/reorder, paired Wi-Fi remote. Includes original demo only; no licensed commercial songs bundled. Test signing can change across builds; export/retain your original media files before replacing a test install."