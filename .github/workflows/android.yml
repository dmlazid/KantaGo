name: Build APK
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
    paths-ignore: ['README.md', 'docs/**']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools platforms;android-35 build-tools;35.0.0
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      # Keep the new Preview package signed with the same test certificate.
      # A GitHub Actions cache can expire. Never rely on it for production signing.
      - name: Restore KantaGo signing certificate
        id: preview-key
        uses: actions/cache@v4
        with:
          path: ~/.android/debug.keystore
          key: kantago-preview-debug-signing-v1
      - name: Verify KantaGo signing certificate
        run: |
          if [ ! -f "$HOME/.android/debug.keystore" ]; then
            mkdir -p "$HOME/.android"
            keytool -genkeypair -noprompt -keystore "$HOME/.android/debug.keystore"               -alias androiddebugkey -storepass android -keypass android               -keyalg RSA -keysize 2048 -validity 10000               -dname "CN=KantaGo Preview Test, O=KantaGo, C=PH"
          fi
          if [ -f signing/preview-cert.sha256 ]; then
            EXPECTED="$(tr -d '[:space:]' < signing/preview-cert.sha256 | tr '[:lower:]' '[:upper:]')"
            ACTUAL="$(keytool -list -v -keystore "$HOME/.android/debug.keystore"               -storepass android -alias androiddebugkey | sed -n 's/^[[:space:]]*SHA256:[[:space:]]*//p' | head -1 | tr -d '[:space:]' | tr '[:lower:]' '[:upper:]')"
            if [ "$EXPECTED" != "$ACTUAL" ]; then
              echo "::error::KantaGo signing key is missing or changed. Build stopped to avoid an incompatible update."
              exit 1
            fi
          fi
      - name: Core checks
        run: |
          bash tests/run.sh
          node --check app/src/main/assets/app.js
      - name: Build installable test APK
        run: gradle :app:assembleDebug :app:lintDebug --no-daemon
      - name: Show KantaGo certificate identity
        run: |
          keytool -list -v -keystore "$HOME/.android/debug.keystore" -storepass android             -alias androiddebugkey | grep -E "SHA256:" | head -1
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging             app/build/outputs/apk/debug/app-debug.apk | grep '^package:'
      - uses: actions/upload-artifact@v4
        with:
          name: KantaGo-0.5.0-debug
          path: app/build/outputs/apk/debug/app-debug.apk
      - name: Publish APK and original starter song bundle
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 -m pip install --disable-pip-version-check "cryptography>=44,<47"
          python3 tools/create_original_demos.py --output "$RUNNER_TEMP/kantago-original-songs"
          python3 tools/create_activated_pack.py --source "$RUNNER_TEMP/kantago-original-songs" --output KantaGo-Starter-Collection.kgpack --activation-key "KANTA-START-2026" --confirm-rights
          cp app/build/outputs/apk/debug/app-debug.apk KantaGo-0.5.0.apk
          TAG="test-${GITHUB_RUN_NUMBER}"
          gh release create "$TAG" KantaGo-0.5.0.apk KantaGo-Starter-Collection.kgpack --title "KantaGo 0.5.0 · Build ${GITHUB_RUN_NUMBER}" --prerelease --notes "KantaGo 0.5.0 includes an optional encrypted Starter Song Collection with 8 original karaoke practice tracks. Download KantaGo-Starter-Collection.kgpack and enter the starter activation key: KANTA-START-2026. No copyrighted or pirated commercial songs are included. Android package signing and user song data remain unchanged."