name: Build APK
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
    paths-ignore: ['README.md', 'docs/**']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools platforms;android-35 build-tools;35.0.0
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      # Pin the signing key for future KantaGo com.kantago.player versions.
      # A GitHub Actions cache can expire. Never rely on it for production signing.
      - name: Restore KantaGo signing certificate
        id: preview-key
        uses: actions/cache@v4
        with:
          path: ~/.android/debug.keystore
          key: kantago-preview-debug-signing-v1
      - name: Verify KantaGo signing certificate
        run: |
          if [ ! -f "$HOME/.android/debug.keystore" ]; then
            mkdir -p "$HOME/.android"
            keytool -genkeypair -noprompt -keystore "$HOME/.android/debug.keystore"               -alias androiddebugkey -storepass android -keypass android               -keyalg RSA -keysize 2048 -validity 10000               -dname "CN=KantaGo Preview Test, O=KantaGo, C=PH"
          fi
          if [ -f signing/preview-cert.sha256 ]; then
            EXPECTED="$(tr -d '[:space:]' < signing/preview-cert.sha256 | tr '[:lower:]' '[:upper:]')"
            ACTUAL="$(keytool -list -v -keystore "$HOME/.android/debug.keystore"               -storepass android -alias androiddebugkey | sed -n 's/^[[:space:]]*SHA256:[[:space:]]*//p' | head -1 | tr -d '[:space:]' | tr '[:lower:]' '[:upper:]')"
            if [ "$EXPECTED" != "$ACTUAL" ]; then
              echo "::error::KantaGo signing key is missing or changed. Build stopped to avoid an incompatible update."
              exit 1
            fi
          fi
      - name: Core checks
        run: |
          bash tests/run.sh
          node --check app/src/main/assets/app.js
      - name: Build and verify original starter collection
        run: |
          python3 -m pip install --disable-pip-version-check "cryptography>=44,<47"
          python3 tools/create_original_demos.py --output "$RUNNER_TEMP/kantago-original-songs"
          python3 tools/create_activated_pack.py --source "$RUNNER_TEMP/kantago-original-songs" --output KantaGo-Starter-Collection.kgpack --activation-key "KANTA-START-2026" --confirm-rights
          javac -d /tmp/kantago-test app/src/main/java/com/kantago/app/MidiSong.java app/src/main/java/com/kantago/app/SongPack.java app/src/main/java/com/kantago/app/ActivatedPack.java tests/PackInteropTest.java
          java -cp /tmp/kantago-test com.kantago.app.PackInteropTest KantaGo-Starter-Collection.kgpack
      - name: Build installable test APK
        run: gradle :app:assembleDebug :app:lintDebug --no-daemon
      - name: Verify signed APK certificate and compare historical builds
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          APKSIGNER="$ANDROID_HOME/build-tools/35.0.0/apksigner"
          cert_of() {
            "$APKSIGNER" verify --print-certs "$1" | sed -n 's/^Signer #1 certificate SHA-256 digest: //p' | head -1 | tr -d ':[:space:]' | tr '[:lower:]' '[:upper:]'
          }
          EXPECTED="$(tr -d ':[:space:]' < signing/preview-cert.sha256 | tr '[:lower:]' '[:upper:]')"
          CURRENT="$(cert_of app/build/outputs/apk/debug/app-debug.apk)"
          echo "Current APK actual certificate SHA256: $CURRENT"
          echo "Pinned expected SHA256: $EXPECTED"
          PKG=$("$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging app/build/outputs/apk/debug/app-debug.apk | sed -n "s/^package: name='\\([^']*\\)'.*/\\1/p")
          echo "APK application ID: $PKG"
          if [[ "$PKG" != "com.kantago.player" ]]; then
            echo "::error::Expected side-by-side KantaGo package, found $PKG"; exit 1
          fi
          if [[ -z "$CURRENT" || "$CURRENT" != "$EXPECTED" ]]; then
            echo "::warning::APK signer differs from pinned debug keystore; checking old releases to determine the original installed signer."
          fi
          echo "Android Gradle signing configuration:"
          gradle :app:signingReport --no-daemon | grep -E 'Variant:|Config:|Store:|Alias:|SHA-256:' || true
          mkdir -p "$RUNNER_TEMP/kantago-history"
          for version in "test-6:KantaGo-0.2.2-test.apk" "test-7:KantaGo-0.2.2-test.apk" "test-8:KantaGo-0.2.3.apk" "test-17:KantaGo-0.4.0.apk" "test-19:KantaGo-0.5.1.apk"; do
            tag="${version%%:*}"
            file="${version#*:}"
            if gh release download "$tag" --pattern "$file" --dir "$RUNNER_TEMP/kantago-history" --clobber; then
              SIGNER="$(cert_of "$RUNNER_TEMP/kantago-history/$file")"
              echo "APK signature for $tag: $SIGNER"
              if [[ "$SIGNER" != "$EXPECTED" ]]; then
                echo "::warning::$tag was signed with a different key from the current release"
              fi
              rm -f "$RUNNER_TEMP/kantago-history/$file"
            else
              echo "::warning::Historical release $tag unavailable for signature comparison"
            fi
          done
          if [[ -z "$CURRENT" || "$CURRENT" != "$EXPECTED" ]]; then
            echo "::error::APK signing certificate mismatch found; build stopped. Update signing configuration before publishing."
            exit 1
          fi
      - name: Verify built-in offline karaoke exists in finished APK
        run: |
          set -euo pipefail
          FILE="app/build/outputs/apk/debug/app-debug.apk"
          ASSETS="$(unzip -Z1 "$FILE")"
          grep -q '^assets/builtin/catalog.json$' <<< "$ASSETS"
          COUNT="$(grep -Ec '^assets/builtin/kb-[0-9]{6}\.kar$' <<< "$ASSETS")"
          echo "APK includes $COUNT playable karaoke MIDI/KAR files"
          test "$COUNT" -eq 48
      - name: Show KantaGo certificate identity
        run: |
          keytool -list -v -keystore "$HOME/.android/debug.keystore" -storepass android             -alias androiddebugkey | grep -E "SHA256:" | head -1
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging             app/build/outputs/apk/debug/app-debug.apk | grep '^package:'
      - uses: actions/upload-artifact@v4
        with:
          name: KantaGo-0.6.0-debug
          path: app/build/outputs/apk/debug/app-debug.apk
      - name: Publish APK and original starter song bundle
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp app/build/outputs/apk/debug/app-debug.apk KantaGo-0.6.0.apk
          TAG="test-${GITHUB_RUN_NUMBER}"
          gh release create "$TAG" KantaGo-0.6.0.apk KantaGo-Starter-Collection.kgpack --title "KantaGo 0.6.0 · Build ${GITHUB_RUN_NUMBER}" --prerelease --notes "KantaGo 0.6.0 includes 48 ready-to-play offline MIDI karaoke songs with timed lyrics: 40 original compositions and 8 traditional melodies. No music download or activation is needed. Settings can delete user-imported music after confirmation, while always preserving built-in songs. Same package ID and pinned signing certificate as recent 0.5.x releases. Original optional starter pack remains available. No third-party commercial recordings are bundled."
